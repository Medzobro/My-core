version: '3.9'

services:
  api:
    build: .
    container_name: lost-eth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  webui:
    image: nginx:alpine
    container_name: lost-eth-webui
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web_ui:/usr/share/nginx/html:ro
    depends_on:
      - api

  monitor:
    build: .
    container_name: lost-eth-monitor
    restart: unless-stopped
    command: python3 monitor.py --interval 600 ${MONITOR_ADDRESSES:-0x0000000000000000000000000000000000000000}
    volumes:
      - ./data:/app/data
    profiles: ["monitor"]
