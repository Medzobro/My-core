version: "3.9"

services:
  audit:
    build: .
    container_name: mustahaqati
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      - ./data:/app/data
      - cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3

  monitor:
    build: .
    container_name: mustahaqati-monitor
    restart: unless-stopped
    command: python lost_eth.py monitor ${MONITOR_ADDRESSES:-0x0000000000000000000000000000000000000000} --interval 600
    volumes:
      - ./data:/app/data
      - cache:/app/cache
    profiles: ["monitor"]

volumes:
  cache:
